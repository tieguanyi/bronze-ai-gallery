<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文物文化叙事展 · 青铜青语</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">青铜青语·重绘风华</div>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="speed.html">文物速览</a></li>
                <li><a href="move.html">文物动起来</a></li>
                <li><a href="culture.html" class="active">文物文化叙事展</a></li>
            </ul>
            <div class="hamburger">☰</div>
        </nav>
    </header>

    <main>
        <h1 class="page-title">🏺 文物文化叙事展 · 历史故事</h1>
        <p class="subtitle">点击任意卡片，了解青铜器背后的礼乐、战争与信仰</p>
        <div class="cards-grid" id="culture-grid"></div>
    </main>

    <footer>
        <p>© 2025 青铜青语·重绘风华项目组 | AI生成内容仅作展示 | 文物原型藏于各大博物馆</p>
    </footer>

    <script src="js/main.js"></script>
    <script>
        // 文物数据（10件，主图路径按实际扩展名）
        const artifacts = [
            { id: 1, name: "八牛贮贝器", img: "assets/images/八牛贮贝器/八牛贮贝器主图.png" },
            { id: 2, name: "大克鼎", img: "assets/images/大克鼎/大克鼎主图.jpg" },
            { id: 3, name: "父乙觥", img: "assets/images/父乙觥/父乙觥主图.jpg" },
            { id: 4, name: "晋侯稣钟", img: "assets/images/晋侯稣钟/晋侯稣钟主图.jpg" },
            { id: 5, name: "龙纹扁足鼎", img: "assets/images/龙纹扁足鼎/龙纹扁足鼎主图.png" },
            { id: 6, name: "商鞅方升", img: "assets/images/商鞅方升/商鞅方升主图.jpg" },
            { id: 7, name: "吴王光剑", img: "assets/images/吴王光剑/吴王光剑主图.jpg" },
            { id: 8, name: "牺尊", img: "assets/images/牺尊/牺尊主图.jpg" },
            { id: 9, name: "镶嵌十字纹方钺", img: "assets/images/镶嵌十字纹方钺/镶嵌十字纹方钺主图.png" },
            { id: 10, name: "子仲姜盘", img: "assets/images/子仲姜盘/子仲姜盘主图.jpg" }
        ];

        const container = document.getElementById('culture-grid');
        artifacts.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card clickable-card';
            card.innerHTML = `
                <img src="${item.img}" alt="${item.name}" class="card-img-real" onerror="this.src='assets/images/placeholder.png'">
                <h3>${item.name}</h3>
            `;
            card.addEventListener('click', () => {
                window.location.href = `detail.html?from=culture&id=${item.id}`;
            });
            container.appendChild(card);
        });
    </script>
</body>
</html>
